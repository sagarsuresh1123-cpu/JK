<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JK Traders — Catalogue Manager</title>
<link rel="stylesheet" href="/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<style>
body{padding:22px}.admin-wrap{max-width:1180px;margin:auto}.admin-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 12px 30px rgba(70,45,25,.08)}.login{max-width:460px;margin:7vh auto}.field{display:grid;gap:7px;margin:10px 0}.field input{padding:13px;border:1px solid var(--line);border-radius:12px;background:#fffdf8;font:inherit}.row{display:grid;grid-template-columns:1.45fr .9fr .7fr 1fr .45fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.row input,.row select{padding:9px;border:1px solid var(--line);border-radius:9px;background:#fffdf8}.btn{border:0;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:700;background:var(--terracotta);color:#fff}.btn.secondary{background:#eadcc9;color:var(--ink)}.btn.danger{background:#7c3f35}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.muted{color:var(--muted)}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}.stat{background:#f6ead9;border:1px solid var(--line);padding:12px 16px;border-radius:14px}.status{min-height:22px;color:var(--muted)}@media(max-width:900px){.row{grid-template-columns:1fr 1fr}.row .wide{grid-column:1/-1}}
</style>
</head>
<body>
<div class="admin-wrap">
 <div id="loginPanel" class="panel login">
  <div class="eyebrow">JK TRADERS</div><h1>Catalogue Manager</h1>
  <p class="muted">Manage your live product catalogue from any phone or computer.</p>
  <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="Your admin email"></div>
  <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your admin password"></div>
  <button class="btn" onclick="login()">Log in</button><p id="loginMsg" class="status"></p>
 </div>

 <div id="app" style="display:none">
  <div class="admin-head">
   <div><div class="eyebrow">JK TRADERS</div><h1>Catalogue Manager</h1><p class="muted">Your live catalogue</p></div>
   <div class="toolbar"><a class="btn secondary" href="/">View store</a><button class="btn secondary" onclick="logout()">Log out</button></div>
  </div>
  <div class="panel">
   <div class="stats"><div class="stat"><b id="totalCount">0</b><br><span class="muted">Products</span></div><div class="stat"><b id="visibleCount">0</b><br><span class="muted">Visible</span></div></div>
   <div class="toolbar">
    <button class="btn" onclick="showAdd()">+ Add product</button>
    <button class="btn secondary" onclick="exportJson()">Export catalogue</button>
    <label class="btn secondary">Import JSON<input id="importFile" type="file" accept=".json" hidden onchange="importJson(event)"></label>
    <input id="searchAdmin" placeholder="Search products…" oninput="renderTable()" style="padding:10px;border:1px solid var(--line);border-radius:12px;min-width:240px">
   </div>
   <div id="editor"></div><p id="status" class="status"></p><div id="table"></div>
  </div>
 </div>
</div>
<script>
const cats=["Rice & Grains","Dals & Pulses","Spices & Masalas","Atta & Flours","Dry Fruits & Nuts","Oils & Ghee","Snacks & Biscuits","Beverages","Papad & Sandige","Household","Others","Sugar & Jaggery","Salt & Sugar","Dry Fruits & Spices"];
let client,products=[];
function esc(s){return String(s??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c]));}
function setStatus(t){document.getElementById("status").textContent=t||"";document.getElementById("loginMsg").textContent=t||"";}
async function setup(){client=supabase.createClient(window.JK_SUPABASE_URL,window.JK_SUPABASE_ANON_KEY);const {data:{session}}=await client.auth.getSession();if(session)start();else document.getElementById("loginPanel").style.display="block";}
async function login(){setStatus("Logging in…");const {error}=await client.auth.signInWithPassword({email:email.value,password:password.value});if(error){setStatus(error.message);return;}start();}
async function logout(){await client.auth.signOut();location.reload();}
async function start(){document.getElementById("loginPanel").style.display="none";document.getElementById("app").style.display="block";await load();}
async function load(){const {data,error}=await client.from("products").select("*").order("category").order("name");if(error){setStatus(error.message);return;}products=data||[];renderTable();}
function renderTable(){
 const q=document.getElementById("searchAdmin").value.toLowerCase();
 const list=products.filter(p=>`${p.name} ${p.category}`.toLowerCase().includes(q));
 totalCount.textContent=products.length;visibleCount.textContent=products.filter(p=>p.active).length;
 table.innerHTML=list.map(p=>`<div class="row"><input value="${esc(p.name)}" data-k="name" data-id="${p.id}"><input value="${esc(p.size)}" data-k="size" data-id="${p.id}"><input type="number" step=".01" value="${p.price}" data-k="price" data-id="${p.id}"><select data-k="category" data-id="${p.id}">${cats.map(c=>`<option ${c===p.category?"selected":""}>${c}</option>`).join("")}</select><input value="${esc(p.icon||"🧺")}" data-k="icon" data-id="${p.id}"><label><input type="checkbox" ${p.active?"checked":""} data-k="active" data-id="${p.id}"> Visible</label><button class="btn" onclick="saveRow(${p.id})">Save</button><button class="btn danger" onclick="del(${p.id})">Delete</button></div>`).join("");
}
function rowData(id){const out={};document.querySelectorAll(`[data-id="${id}"]`).forEach(n=>out[n.dataset.k]=n.type==="checkbox"?n.checked:n.dataset.k==="price"?Number(n.value):n.value);return out;}
async function saveRow(id){setStatus("Saving…");const {data,error}=await client.from("products").update(rowData(id)).eq("id",id).select().single();if(error){setStatus(error.message);return;}products=products.map(p=>p.id===id?data:p);setStatus("Saved — customers now see the updated product.");renderTable();}
async function del(id){if(!confirm("Delete this product permanently?"))return;const {error}=await client.from("products").delete().eq("id",id);if(error){setStatus(error.message);return;}products=products.filter(p=>p.id!==id);renderTable();}
function showAdd(){editor.innerHTML=`<div class="panel" style="margin:12px 0"><h3>Add product</h3><div class="row"><input id="newName" placeholder="Product name"><input id="newSize" placeholder="Size"><input id="newPrice" type="number" step=".01" placeholder="Price"><select id="newCat">${cats.map(c=>`<option>${c}</option>`).join("")}</select><input id="newIcon" value="🧺"><span></span><button class="btn" onclick="addProduct()">Save</button></div></div>`;}
async function addProduct(){const p={name:newName.value.trim(),size:newSize.value.trim()||"As listed",price:Number(newPrice.value),category:newCat.value,icon:newIcon.value||"🧺",active:true};const {data,error}=await client.from("products").insert(p).select().single();if(error){setStatus(error.message);return;}products.push(data);editor.innerHTML="";renderTable();setStatus("Product added.");}
function exportJson(){const blob=new Blob([JSON.stringify(products,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="jk-traders-catalogue.json";a.click();URL.revokeObjectURL(a.href);}
async function importJson(e){const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data))throw Error("JSON must be an array");const clean=data.map(({id,created_at,updated_at,...p})=>p);const {error}=await client.from("products").insert(clean);if(error)throw error;await load();setStatus("Catalogue imported.");}catch(err){setStatus(err.message)}e.target.value="";}
if(window.JK_SUPABASE_URL==="YOUR_SUPABASE_PROJECT_URL"){document.getElementById("loginMsg").textContent="Add your Supabase URL and anon key to supabase-config.js first."}else setup();
</script>
</body></html>
